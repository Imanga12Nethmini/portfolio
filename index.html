<body>
<div id="root"></div>
<script>
/* Friendly error screen if the page is opened without the Vite dev server */
(function () {
  function show(msg) {
    if (document.getElementById('fallback')) return;
    var s = document.createElement('style');
    s.textContent = '#fallback{position:fixed;inset:0;z-index:99999;background:#0A0A0B;color:#E7F0EE;display:flex;align-items:center;justify-content:center;padding:2rem;font:400 16px/1.7 system-ui,sans-serif;text-align:center}#fallback .card{max-width:36rem}#fallback h1{font-size:22px;margin:0 0 12px;letter-spacing:-.02em}#fallback p{color:#9C9CA6;margin:0 0 12px}#fallback b{color:#FF5A1F}';
    document.head.appendChild(s);
    var d = document.createElement('div');
    d.id = 'fallback';
    d.innerHTML = '<div class="card"><h1>The portfolio needs its dev server</h1>' +
      '<p>' + msg + '</p>' +
      '<p>Fix: double-click <b>start.bat</b> in the portfolio folder, wait a few seconds, and the site opens automatically at <b>http://localhost:5173</b>.</p>' +
      '<p>Or run <b>npm run dev</b> in that folder and open the link it prints. Keep that window open while you browse.</p>' +
      '<p>Do not open index.html directly and do not use Live Server — React must be compiled by Vite.</p></div>';
    document.body.appendChild(d);
  }
  var isSource = document.querySelector('script[type="module"][src*="/src/"]');
  if (location.protocol === 'file:' && isSource) {
    location.replace('Portfolio.html');
    return;
  }
  if (isSource) {
    fetch('/@vite/client')
      .then(function (r) { if (!r.ok) show('This page is served without Vite (for example Live Server). Double-click "Open Portfolio.bat" or "Portfolio.html" instead.'); })
      .catch(function () { show('The dev server is not reachable. Double-click "Open Portfolio.bat" or "Portfolio.html" instead.'); });
  }
})();
</script>
